name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"

env:
  CODEQL_ACTION_FEATURE_SANDWICH: false

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3
        with:
          languages: ${{ matrix.language }}
          db-location: ${{ runner.temp }}/codeql_databases

      - name: Autobuild
        uses: github/codeql-action/autobuild@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3
        with:
          upload: always
